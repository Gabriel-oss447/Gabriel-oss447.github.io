<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta | Centenario</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <!-- CABECERA: logo + enlaces + botones de sesión (los rellena app.js en #nav-session) -->
    <a class="logo" href="index.html"><img src="Assets/Imagenes/Logo.png" alt="Logo Kristel"></a>
    <nav class="main-nav" aria-label="Menú principal">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="proyectos.html">Proyectos</a></li>
      </ul>
      <div class="nav-actions"><span id="nav-session" class="nav-session"></span></div>
    </nav>
  </header>

  <!-- ============ REGISTRO DE USUARIO ============
       Pide: correo, contraseña, DNI y celular.
       La validación y el guardado están en app.js → initRegistro() -->
  <main class="auth-page">
    <section class="auth-box">
      <h1>Crear cuenta</h1>
      <form id="form-registro" novalidate>
        <div class="form-field">
          <label for="reg-correo">Correo electrónico</label>
          <input type="email" id="reg-correo" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label for="reg-password">Contraseña (mínimo 6 caracteres)</label>
          <input type="password" id="reg-password" autocomplete="new-password" required>
        </div>
        <div class="form-field">
          <label for="reg-dni">DNI</label>
          <input type="text" id="reg-dni" inputmode="numeric" maxlength="8" placeholder="8 dígitos" required>
        </div>
        <div class="form-field">
          <label for="reg-celular">Número de celular</label>
          <input type="tel" id="reg-celular" inputmode="numeric" maxlength="9" placeholder="9 dígitos, empieza con 9" required>
        </div>
        <p class="msg" id="msg-registro" role="status"></p>
        <button type="submit" class="btn btn-primary btn-block">Registrarme</button>
      </form>
      <p class="auth-alt">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
