<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel del administrador | Centenario</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <!-- CABECERA: logo + enlaces + botones de sesión (los rellena app.js en #nav-session) -->
    <a class="logo" href="index.html"><img src="Assets/Imagenes/Logo.png" alt="Logo Kristel"></a>
    <nav class="main-nav" aria-label="Menú principal">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="proyectos.html">Proyectos</a></li>
      </ul>
      <div class="nav-actions"><span id="nav-session" class="nav-session"></span></div>
    </nav>
  </header>

  <!-- ============ PERFIL DEL ADMINISTRADOR ============
       Muestra las solicitudes enviadas desde el formulario de index.html.
       Solo entra quien inicie sesión como admin (se valida en app.js → initAdmin()) -->
  <main class="admin-page">
    <h1>Solicitudes de información</h1>

    <!-- Contadores -->
    <section class="admin-stats">
      <article class="stat"><strong id="c-total">0</strong><span>Total</span></article>
      <article class="stat"><strong id="c-pendientes">0</strong><span>Pendientes</span></article>
      <article class="stat"><strong id="c-atendidas">0</strong><span>Atendidas</span></article>
    </section>

    <!-- Filtro por estado -->
    <div class="admin-filtro">
      <label for="filtro">Mostrar:</label>
      <select id="filtro">
        <option value="todas">Todas</option>
        <option value="pendientes">Pendientes</option>
        <option value="atendidas">Atendidas</option>
      </select>
    </div>

    <!-- Tabla de solicitudes (las filas las genera app.js) -->
    <div class="table-wrap">
      <table class="tabla">
        <thead>
          <tr>
            <th>#</th><th>Fecha</th><th>Nombre</th><th>Correo</th><th>Documento</th>
            <th>Teléfono</th><th>Proyecto de interés</th><th>Estado</th><th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-solicitudes"></tbody>
      </table>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
