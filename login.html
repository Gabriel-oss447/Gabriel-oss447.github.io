<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Centenario</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <!-- CABECERA: logo + enlaces + botones de sesión (los rellena app.js en #nav-session) -->
    <a class="logo" href="index.html"><img src="Logo.png" alt="Logo Kristel"></a>
    <nav class="main-nav" aria-label="Menú principal">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="proyectos.html">Proyectos</a></li>
      </ul>
      <div class="nav-actions"><span id="nav-session" class="nav-session"></span></div>
    </nav>
  </header>

  <!-- ============ INICIO DE SESIÓN ============
       Lo usan usuarios Y administrador; solo piden correo y contraseña.
       Si es administrador, app.js lo envía a admin.html -->
  <main class="auth-page">
    <section class="auth-box">
      <h1>Iniciar sesión</h1>
      <form id="form-login" novalidate>
        <div class="form-field">
          <label for="log-correo">Correo electrónico</label>
          <input type="email" id="log-correo" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label for="log-password">Contraseña</label>
          <input type="password" id="log-password" autocomplete="current-password" required>
        </div>
        <p class="msg" id="msg-login" role="status"></p>
        <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
      </form>
      <p class="auth-alt">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
